<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medium to Freedium</title>
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      margin: 0;
      font-size: 18px;
      color: #333;
    }
    .status {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
    }
    .status.medium {
      background-color: #e8f5e9;
      border: 2px solid #4caf50;
      color: #2e7d32;
    }
    .status.not-medium {
      background-color: #f5f5f5;
      border: 2px solid #ccc;
      color: #666;
    }
    .status-icon {
      font-size: 24px;
      margin-bottom: 8px;
    }
    .status-text {
      font-size: 14px;
      font-weight: 500;
    }
    .button {
      width: 100%;
      padding: 12px;
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .button:hover {
      background-color: #45a049;
    }
    .button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .info {
      margin-top: 15px;
      padding: 10px;
      background-color: #f0f0f0;
      border-radius: 6px;
      font-size: 12px;
      color: #666;
      line-height: 1.5;
    }
    .url-preview {
      margin-top: 10px;
      padding: 8px;
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 11px;
      color: #333;
      word-break: break-all;
      max-height: 60px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Medium to Freedium</h1>
  </div>
  
  <div id="status" class="status">
    <div class="status-icon">⏳</div>
    <div class="status-text">Checking...</div>
  </div>
  
  <button id="redirectBtn" class="button" disabled>Redirect to Freedium</button>
  
  <div class="info">
    <strong>How it works:</strong><br>
    When you're on a Medium article, the extension badge turns green. Click the button above to redirect to freedium-mirror.cfd for unrestricted access.
  </div>
  
  <div id="urlPreview" class="url-preview" style="display: none;"></div>
  
  <script src="popup.js"></script>
</body>
</html>
